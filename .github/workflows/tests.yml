name: tests
on:
  push:
    branches: [main, app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: middlewatch
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API into its isolated environment
        run: |
          python -m venv api/.venv
          api/.venv/bin/python -m pip install -r api/requirements.txt
      - name: Existing and API tests
        run: api/.venv/bin/python -m pytest tests api/tests -q
      - name: Database migrations and schema drift
        run: |
          api/.venv/bin/python -m alembic upgrade head
          api/.venv/bin/python -m alembic check
      - name: Frozen benchmark and HTTP equivalence
        run: |
          api/.venv/bin/python scripts/verify_baseline.py
          api/.venv/bin/python scripts/evaluate_http.py
      - name: Ephemeral Postgres migration and workflow
        env:
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/middlewatch
        run: api/.venv/bin/python scripts/smoke_postgres.py
      - name: Web install, build, lint and unit tests
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
      - name: Browser workflow, mobile, keyboard and accessibility
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Python dependency audit (report-only)
        continue-on-error: true
        run: |
          api/.venv/bin/python -m pip install pip-audit
          api/.venv/bin/python -m pip_audit -r api/requirements.txt
      - name: Source, built output and history checks
        run: api/.venv/bin/python scripts/check_repository.py
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: web/test-results
          retention-days: 7
